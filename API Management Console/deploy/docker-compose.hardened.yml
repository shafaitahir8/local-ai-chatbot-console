version: "3.9"

x-app-base: &app-base
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - ../.env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://chatbot:chatbot@postgres:5432/chatbot_console
    REDIS_URL: redis://redis:6379/0
  restart: on-failure:5
  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chatbot_console
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_console"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: on-failure:5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    restart: on-failure:5
    volumes:
      - redis_data:/data

  api:
    <<: *app-base
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_RUNTIME_ROLE: api
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@postgres:5432/chatbot_console
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app-base
    command: ["python", "-m", "app.runtime_supervisor", "scheduler"]

  scraper-worker:
    <<: *app-base
    command: ["python", "-m", "app.runtime_supervisor", "scraper-worker"]

  embedding-worker:
    <<: *app-base
    command: ["python", "-m", "app.runtime_supervisor", "embedding-worker"]

  gateway-agent:
    <<: *app-base
    command: ["python", "-m", "app.runtime_supervisor", "gateway-agent"]

  tunnel-agent:
    <<: *app-base
    command: ["python", "-m", "app.runtime_supervisor", "tunnel-agent"]

  ollama-sentinel:
    <<: *app-base
    command: ["python", "-m", "app.runtime_supervisor", "ollama-sentinel"]
    profiles: ["local-llm"]

volumes:
  postgres_data:
  redis_data:
